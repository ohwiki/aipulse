name: Daily Fetch

on:
  schedule:
    - cron: "30 20 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch sources
        env:
          PRODUCTHUNT_DEVELOPER_TOKEN: ${{ secrets.PRODUCTHUNT_DEVELOPER_TOKEN }}
          PRODUCTHUNT_CLIENT_ID: ${{ secrets.PRODUCTHUNT_CLIENT_ID }}
          PRODUCTHUNT_CLIENT_SECRET: ${{ secrets.PRODUCTHUNT_CLIENT_SECRET }}
        run: uv run python tools/fetch_sources.py

      - name: Score and filter
        env:
          NULLCLAW_API_KEY: ${{ secrets.NULLCLAW_API_KEY }}
          NULLCLAW_BASE_URL: ${{ secrets.NULLCLAW_BASE_URL }}
          NULLCLAW_MODEL: ${{ vars.NULLCLAW_MODEL }}
        run: uv run python tools/score_and_filter.py

      - name: Generate daily
        run: uv run python tools/generate_daily.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: pnpm build

      - name: Publish data branch
        id: publish
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin data >/dev/null; then
            echo "data branch does not exist yet; initialize it once before enabling this workflow."
            exit 1
          fi

          git fetch origin data

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          data_worktree="$RUNNER_TEMP/aipulse-data"
          rm -rf "$data_worktree"
          git worktree add -B data "$data_worktree" origin/data

          mkdir -p "$data_worktree/data/daily"
          cp -R data/daily/. "$data_worktree/data/daily/"
          cp data/latest.json "$data_worktree/data/latest.json"
          node scripts/rebuild-generated-index.mjs --root "$data_worktree"

          cd "$data_worktree"
          git add data/daily data/index.json data/latest.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "daily: $(date +%Y-%m-%d)"
          git push origin HEAD:data
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Netlify build hook
        if: steps.publish.outputs.changed == 'true'
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "NETLIFY_BUILD_HOOK_URL is not set; skipping hook trigger."
            exit 0
          fi

          curl -fsS -X POST "$NETLIFY_BUILD_HOOK_URL"
