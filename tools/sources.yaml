api:
  - name: arXiv cs.AI
    type: arxiv
    query: "cat:cs.AI"
    max_results: 30
    category: paper
    window_hours: 72
    keywords_any:
      - agent
      - llm
      - language model
      - reasoning
      - benchmark
  - name: arXiv cs.CL
    type: arxiv
    query: "cat:cs.CL"
    max_results: 30
    category: paper
    window_hours: 72
    keywords_any:
      - llm
      - language model
      - agent
      - rag
      - retrieval
      - benchmark
      - reasoning
  - name: arXiv cs.LG
    type: arxiv
    query: "cat:cs.LG"
    max_results: 40
    category: paper
    window_hours: 72
    keywords_any:
      - llm
      - language model
      - agent
      - multimodal
      - reasoning
      - benchmark
      - open-source
      - inference
  - name: arXiv cs.IR
    type: arxiv
    query: "cat:cs.IR"
    max_results: 30
    category: paper
    window_hours: 72
    keywords_any:
      - rag
      - retrieval
      - search
      - rank
      - re-rank
      - dense retrieval
      - agent
  - name: arXiv cs.CV
    type: arxiv
    query: "cat:cs.CV"
    max_results: 30
    category: paper
    window_hours: 72
    keywords_any:
      - multimodal
      - vision-language
      - vla
      - agent
      - video
      - diffusion
      - world model
  - name: HuggingFace Daily Papers
    type: hf_papers
    url: https://huggingface.co/api/daily_papers
    category: paper
    window_hours: 72
    keywords_any:
      - llm
      - language model
      - agent
      - multimodal
      - reasoning
      - benchmark
      - retrieval
      - diffusion
  - name: Product Hunt AI
    type: producthunt
    category: ai-products
    max_results: 12
    page_size: 12
    window_hours: 24
    keywords_any:
      - ai
      - llm
      - agent
      - gpt
      - claude
      - openai
      - anthropic
      - prompt
      - automation
      - coding
      - developer

daily:
  category_limits:
    ai-models: 4
    ai-products: 4
    industry: 4
    paper: 8
    tip: 4
    cn-media: 4

